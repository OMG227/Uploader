<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPLOADER — panelhp.my.id</title>
<style>
:root{--bg:#fffdf0;--fg:#000;--card:#fff;--acc:#ff5c8a;--acc2:#ffe600;--ok:#4dff88;--bad:#ff3b3b}
[data-theme="dark"]{--bg:#111;--fg:#fff;--card:#1c1c1c;--acc:#ff5c8a;--acc2:#ffe600;--ok:#4dff88;--bad:#ff3b3b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Courier New",monospace;padding:20px;min-height:100vh}
.wrap{max-width:640px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}
h1{margin:0;font-size:clamp(28px,8vw,44px);background:var(--acc2);color:#000;border:4px solid var(--fg);box-shadow:6px 6px 0 var(--fg);padding:4px 12px;text-transform:uppercase;letter-spacing:-1px}
button,.btn{font-family:inherit;font-weight:900;text-transform:uppercase;border:4px solid var(--fg);background:var(--acc);color:#000;padding:12px 16px;cursor:pointer;box-shadow:5px 5px 0 var(--fg);font-size:15px}
button:active{transform:translate(5px,5px);box-shadow:none}
button:disabled{opacity:.5;cursor:not-allowed}
#theme{background:var(--card);color:var(--fg);padding:8px 12px}
.card{background:var(--card);border:4px solid var(--fg);box-shadow:8px 8px 0 var(--fg);padding:18px;margin-bottom:24px}
#drop{border:4px dashed var(--fg);padding:36px 12px;text-align:center;font-weight:900;cursor:pointer;text-transform:uppercase;background:var(--bg)}
#drop.over{background:var(--acc2);color:#000}
#info{margin:14px 0;font-weight:700;word-break:break-all}
.bar{height:26px;border:4px solid var(--fg);background:var(--card);margin:14px 0;display:none}
.bar div{height:100%;width:0;background:var(--ok);transition:width .15s}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row button{flex:1}
#msg{font-weight:900;margin-top:12px;padding:10px;border:4px solid var(--fg);display:none}
#msg.err{background:var(--bad);color:#000}
#msg.ok{background:var(--ok);color:#000}
h2{margin:0 0 12px;text-transform:uppercase;background:var(--fg);color:var(--bg);display:inline-block;padding:2px 10px;font-size:18px}
.item{border:4px solid var(--fg);padding:10px;margin-bottom:12px;background:var(--bg)}
.item img{max-width:100%;max-height:160px;border:3px solid var(--fg);display:block;margin-bottom:8px}
.item a{color:var(--fg);font-weight:900;word-break:break-all}
.meta{font-size:13px;margin:6px 0}
.item button{padding:6px 10px;font-size:13px;box-shadow:3px 3px 0 var(--fg)}
footer{text-align:center;font-weight:900;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Uploader</h1>
    <button id="theme">Gelap/Terang</button>
  </header>

  <div class="card">
    <input type="file" id="file" hidden>
    <div id="drop">Klik atau drop file di sini</div>
    <div id="info">Belum ada file dipilih.</div>
    <div class="bar" id="bar"><div></div></div>
    <div class="row">
      <button id="go" disabled>Upload</button>
      <button id="reset" style="background:var(--acc2)">Reset</button>
    </div>
    <div id="msg"></div>
  </div>

  <div class="card">
    <h2>Riwayat</h2>
    <div id="list"><div class="meta">Kosong.</div></div>
  </div>

  <footer>PANELHP.MY.ID</footer>
</div>

<script>
const KEY = "AIzaBj7z2z3xBjsk";
const DOMAIN = "https://c.termai.cc";
const $ = id => document.getElementById(id);
let picked = null;
let history = [];

// tema
try{ const t = localStorage.getItem("theme"); if(t) document.documentElement.dataset.theme = t; }catch(e){}
$("theme").onclick = () => {
  const n = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = n;
  try{ localStorage.setItem("theme", n); }catch(e){}
};

// riwayat
try{ history = JSON.parse(localStorage.getItem("hist") || "[]"); }catch(e){}
const fmt = b => b > 1048576 ? (b/1048576).toFixed(2)+" MB" : (b/1024).toFixed(1)+" KB";

function render(){
  const l = $("list");
  if(!history.length){ l.innerHTML = '<div class="meta">Kosong.</div>'; return; }
  l.innerHTML = "";
  history.forEach((h,i) => {
    const d = document.createElement("div"); d.className = "item";
    if((h.mimetype||"").startsWith("image/")){
      const im = document.createElement("img"); im.src = h.path; im.alt = ""; d.appendChild(im);
    }
    const a = document.createElement("a"); a.href = h.path; a.target = "_blank"; a.rel = "noopener"; a.textContent = h.path;
    d.appendChild(a);
    const m = document.createElement("div"); m.className = "meta"; m.textContent = h.mimetype + " • " + fmt(h.size);
    d.appendChild(m);
    const c = document.createElement("button"); c.textContent = "Copy";
    c.onclick = () => navigator.clipboard.writeText(h.path).then(() => { c.textContent = "Tersalin!"; setTimeout(() => c.textContent = "Copy", 1200); });
    const x = document.createElement("button"); x.textContent = "Hapus"; x.style.marginLeft = "8px"; x.style.background = "var(--bad)";
    x.onclick = () => { history.splice(i,1); save(); render(); };
    d.appendChild(c); d.appendChild(x);
    l.appendChild(d);
  });
}
function save(){ try{ localStorage.setItem("hist", JSON.stringify(history)); }catch(e){} }

function msg(t, type){ const m = $("msg"); m.textContent = t; m.className = type; m.style.display = "block"; }
function pick(f){
  if(!f) return;
  picked = f;
  $("info").textContent = f.name + " • " + fmt(f.size);
  $("go").disabled = false;
  $("msg").style.display = "none";
}

$("drop").onclick = () => $("file").click();
$("file").onchange = e => pick(e.target.files[0]);
["dragover","dragenter"].forEach(ev => $("drop").addEventListener(ev, e => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave","drop"].forEach(ev => $("drop").addEventListener(ev, e => { e.preventDefault(); $("drop").classList.remove("over"); }));
$("drop").addEventListener("drop", e => pick(e.dataTransfer.files[0]));
document.addEventListener("paste", e => { const f = e.clipboardData && e.clipboardData.files[0]; if(f) pick(f); });

$("reset").onclick = () => {
  picked = null; $("file").value = ""; $("info").textContent = "Belum ada file dipilih.";
  $("go").disabled = true; $("bar").style.display = "none"; $("msg").style.display = "none";
};

$("go").onclick = () => {
  if(!picked) return;
  const fd = new FormData();
  fd.append("file", picked, picked.name);
  const xhr = new XMLHttpRequest();
  xhr.open("POST", DOMAIN + "/api/upload?key=" + KEY);
  $("bar").style.display = "block"; $("bar").firstElementChild.style.width = "0";
  $("go").disabled = true; $("msg").style.display = "none";
  xhr.upload.onprogress = e => { if(e.lengthComputable) $("bar").firstElementChild.style.width = (e.loaded/e.total*100) + "%"; };
  xhr.onload = () => {
    $("go").disabled = false;
    try{
      const r = JSON.parse(xhr.responseText);
      if(r.status && r.path){
        history.unshift({path:r.path, mimetype:r.mimetype||"file", size:r.size||picked.size});
        history = history.slice(0,20); save(); render();
        msg("BERHASIL! Link sudah masuk riwayat.", "ok");
      } else msg("GAGAL: " + (r.message || r.error || xhr.responseText.slice(0,120)), "err");
    }catch(e){ msg("GAGAL: respons server tidak valid.", "err"); }
  };
  xhr.onerror = () => { $("go").disabled = false; msg("GAGAL: koneksi/CORS diblokir server.", "err"); };
  xhr.send(fd);
};

render();
</script>
</body>
</html>
