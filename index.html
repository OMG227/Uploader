<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPLOADER</title>
<style>
:root{--bg:#fffdf0;--fg:#000;--card:#fff;--acc:#ff5c8a;--acc2:#ffe600;--ok:#4dff88;--bad:#ff3b3b}
[data-theme="dark"]{--bg:#111;--fg:#fff;--card:#1c1c1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Courier New",monospace;padding:20px;min-height:100vh}
.wrap{max-width:640px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}
h1{margin:0;font-size:clamp(28px,8vw,44px);background:var(--acc2);color:#000;border:4px solid var(--fg);box-shadow:6px 6px 0 var(--fg);padding:4px 12px;text-transform:uppercase;letter-spacing:-1px}
button{font-family:inherit;font-weight:900;text-transform:uppercase;border:4px solid var(--fg);background:var(--acc);color:#000;padding:12px 16px;cursor:pointer;box-shadow:5px 5px 0 var(--fg);font-size:15px}
button:active{transform:translate(5px,5px);box-shadow:none}
button:disabled{opacity:.5;cursor:not-allowed}
#theme{background:var(--card);color:var(--fg);padding:8px 12px}
.card{background:var(--card);border:4px solid var(--fg);box-shadow:8px 8px 0 var(--fg);padding:18px;margin-bottom:24px}
#drop{border:4px dashed var(--fg);padding:36px 12px;text-align:center;font-weight:900;cursor:pointer;text-transform:uppercase;background:var(--bg)}
#drop.over{background:var(--acc2);color:#000}
#info{margin:14px 0;font-weight:700;word-break:break-all}
.bar{height:26px;border:4px solid var(--fg);background:var(--card);margin:14px 0;display:none}
.bar div{height:100%;width:0;background:var(--ok);transition:width .15s}
.row{display:flex;gap:10px;flex-wrap:wrap}.row button{flex:1}
#res{display:none;margin-top:16px;padding:12px;border:4px solid var(--fg);font-weight:900;word-break:break-all}
#res.ok{background:var(--ok);color:#000}#res.err{background:var(--bad);color:#000}
#res a{color:#000}
#res .meta{font-size:13px;margin:8px 0;font-weight:700}
#res button{padding:6px 10px;font-size:13px;box-shadow:3px 3px 0 #000;background:#fff}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Uploader</h1><button id="theme">Gelap/Terang</button></header>
  <div class="card">
    <input type="file" id="file" hidden>
    <div id="drop">Klik atau drop file di sini</div>
    <div id="info">Belum ada file dipilih.</div>
    <div class="bar" id="bar"><div></div></div>
    <div class="row"><button id="go" disabled>Upload</button><button id="reset" style="background:var(--acc2)">Reset</button></div>
    <div id="res"></div>
  </div>
</div>

<script>
const KEY = "AIzaBj7z2z3xBjsk";
const DOMAIN = "https://c.termai.cc";
const MAX = 25 * 1024 * 1024;
const $ = id => document.getElementById(id);
let picked = null;

const fmt = b => b >= 1048576 ? (b/1048576).toFixed(2)+" MB" : b >= 1024 ? (b/1024).toFixed(1)+" KB" : b+" B";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stamp = () => new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Jakarta",dateStyle:"short",timeStyle:"medium"}).format(new Date()) + " WIB";
const one = s => String(s).replace(/[\r\n]+/g," ").slice(0,200); // satu baris saja

try{ const t = localStorage.getItem("theme"); if(t) document.documentElement.dataset.theme = t; }catch(e){}
$("theme").onclick = () => {
  const n = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = n;
  try{ localStorage.setItem("theme", n); }catch(e){}
};

function show(html, type){ const r = $("res"); r.innerHTML = html; r.className = type; r.style.display = "block"; }
function pick(f){
  if(!f) return;
  picked = f; $("info").textContent = f.name + " • " + fmt(f.size);
  $("go").disabled = false; $("res").style.display = "none";
}
$("drop").onclick = () => $("file").click();
$("file").onchange = e => pick(e.target.files[0]);
["dragover","dragenter"].forEach(ev => $("drop").addEventListener(ev, e => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave","drop"].forEach(ev => $("drop").addEventListener(ev, e => { e.preventDefault(); $("drop").classList.remove("over"); }));
$("drop").addEventListener("drop", e => pick(e.dataTransfer.files[0]));
document.addEventListener("paste", e => { const f = e.clipboardData && e.clipboardData.files[0]; if(f) pick(f); });
$("reset").onclick = () => { picked = null; $("file").value = ""; $("info").textContent = "Belum ada file dipilih."; $("go").disabled = true; $("bar").style.display = "none"; $("res").style.display = "none"; };

/* upload langsung ke termai */
function doUpload(file){
  return new Promise(resolve => {
    const t0 = performance.now();
    const fd = new FormData(); fd.append("file", file, file.name);
    const xhr = new XMLHttpRequest();
    xhr.open("POST", DOMAIN + "/api/upload?key=" + KEY);
    $("bar").style.display = "block"; $("bar").firstElementChild.style.width = "0";
    xhr.upload.onprogress = e => { if(e.lengthComputable) $("bar").firstElementChild.style.width = (e.loaded/e.total*100) + "%"; };
    const done = o => resolve({ ...o, ms: Math.round(performance.now() - t0) });
    xhr.onload = () => {
      try{
        const r = JSON.parse(xhr.responseText);
        if(r.status && r.path) done({ ok:true, data:r, http:xhr.status });
        else done({ ok:false, error:(r.message || r.error || xhr.responseText.slice(0,100)), http:xhr.status });
      }catch(e){ done({ ok:false, error:"respons server tidak valid", http:xhr.status }); }
    };
    xhr.onerror = () => done({ ok:false, error:"koneksi gagal / diblokir CORS", http:0 });
    xhr.send(fd);
  });
}

/* isi log.txt, formatnya sesuai contoh */
function buildEntry(file, res){
  const ext = file.name.includes(".") ? file.name.split(".").pop().toLowerCase() : "-";
  const size = (res.ok && res.data.size) || file.size;
  const L = [];
  L.push(`[${stamp()}] ` + (res.ok ? "File has been upload" : "File failed to upload"));
  L.push(`Status   : ${res.ok ? "SUCCESS" : "FAILED"}`);
  L.push(`Nama     : ${one(file.name)}`);
  L.push(`Format   : ${one((res.ok && res.data.mimetype) || file.type || "unknown")} (.${one(ext)})`);
  L.push(`Ukuran   : ${fmt(size)} (${size} bytes)`);
  L.push(res.ok ? `Link     : ${one(res.data.path)}` : `Error    : ${one(res.error)}`);
  L.push(`Server   : ${DOMAIN.replace("https://","")} (HTTP ${res.http})`);
  L.push(`Durasi   : ${(res.ms/1000).toFixed(2)} detik`);
  L.push(`Bahasa   : ${one(navigator.language || "-")}`);
  L.push(`Perangkat: ${one(navigator.userAgent).slice(0,110)}`);
  return L.join("\n");
}
function sendLog(entry){
  fetch("/api/log", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ entry }), keepalive:true }).catch(() => {});
}

$("go").onclick = async () => {
  if(!picked) return;
  const file = picked;
  if(file.size > MAX){ show("GAGAL: file lebih dari 25 MB.", "err"); return; }
  $("go").disabled = true; $("res").style.display = "none";
  const res = await doUpload(file);
  sendLog(buildEntry(file, res));
  $("go").disabled = false;
  if(res.ok){
    const r = res.data;
    show('BERHASIL!<div class="meta">' + esc(r.mimetype || "file") + " • " + fmt(r.size || file.size) + '</div><a href="' + esc(r.path) + '" target="_blank" rel="noopener">' + esc(r.path) + '</a><br><br><button id="cp">Copy link</button>', "ok");
    $("cp").onclick = () => navigator.clipboard.writeText(r.path).then(() => { $("cp").textContent = "Tersalin!"; });
  } else show("GAGAL: " + esc(res.error), "err");
};
</script>
</body>
</html>
